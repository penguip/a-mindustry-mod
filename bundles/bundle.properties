# Sojourner Ammo
block.beepdustry-sojourner.beepdustry-zirconium.info = A standard zirconium missile with generally no special effects.
block.beepdustry-sojourner.beepdustry-energite.info = Contains a high voltage piece of energite that is released upon detonation, resulting in a massive, powerful electric storm.
block.beepdustry-sojourner.beepdustry-actinium.info = Slower in both speed and rotation. Deals heavy damage and irradiates hit targets.
block.beepdustry-sojourner.beepdustry-ageriolix.info = Equipped with a durable force field. Deals high damage and tears hit targets asunder via chromatic dissention.

